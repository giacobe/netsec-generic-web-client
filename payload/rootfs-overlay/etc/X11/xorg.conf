Section "Device"
    Identifier "VGA"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection
Section "Monitor"
    Identifier "Monitor"
    HorizSync 30-70
    VertRefresh 50-75
EndSection
Section "Screen"
    Identifier "Screen"
    Device "VGA"
    Monitor "Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x600"
    EndSubSection
EndSection
Section "InputClass"
    Identifier "Keyboard"
    MatchIsKeyboard "on"
    Driver "evdev"
EndSection
Section "InputClass"
    Identifier "Mouse"
    MatchIsPointer "on"
    Driver "evdev"
EndSection
Section "ServerLayout"
    Identifier "Layout"
    Screen "Screen"
EndSection
